name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify www/index.html & Prepare Icon Asset
        run: |
          mkdir -p www assets
          if [ -f "index.html" ] && [ ! -f "www/index.html" ]; then
            cp index.html www/index.html
          fi
          if [ -f "logo.png" ] && [ ! -f "www/logo.png" ]; then
            cp logo.png www/logo.png
          fi
          ls -la www/ 

      - name: Initialize Capacitor & Add Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/assets
          npx cap init "Tailor Billing App" "com.tailorbilling.app" --web-dir www
          npx cap add android

      - name: Generate App Icon & Configure Android Settings
        run: |
          if [ -f "logo.png" ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#7c2d12' --iconBackgroundColorDark '#5c1f0a'
          fi

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tailorbilling.app",
            "appName": "Tailor Billing App",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true,
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            }
          }
          EOF

          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
              <files-path name="my_files" path="." />
          </paths>
          EOF

          mkdir -p android/app/src/main/java/com/tailorbilling/app
          cat << 'EOF' > android/app/src/main/java/com/tailorbilling/app/MainActivity.java
          package com.tailorbilling.app;

          import android.os.Bundle;
          import android.os.Environment;
          import com.getcapacitor.BridgeActivity;
          import java.io.File;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  File docsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS);
                  File appFolder = new File(docsDir, "TailorBilling");
                  if (!appFolder.exists()) {
                      appFolder.mkdirs();
                  }
              }
          }
          EOF

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Tailor-Billing-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
